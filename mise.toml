[tools]
cmake = "3.30"

# `mise trust && mise bootstrap --yes` installs the system packages this
# project needs to build, scoped per OS via `os` (brew would otherwise also
# run on Linux through linuxbrew). macOS also needs the Xcode Command Line
# Tools (`xcode-select --install`) — that's not something a package manager
# can install, so it isn't listed here; see README.md.
[bootstrap.packages]
"apt:build-essential" = { os = ["linux"] }
"apt:pkg-config" = { os = ["linux"] }
"apt:libwayland-dev" = { os = ["linux"] }
"apt:wayland-protocols" = { os = ["linux"] }
"apt:libegl-dev" = { os = ["linux"] }
"apt:libgl-dev" = { os = ["linux"] }
"apt:curl" = { os = ["linux"] }
"apt:unzip" = { os = ["linux"] }
"apt:socat" = { os = ["linux"] }

"pacman:base-devel" = { os = ["linux"] }
"pacman:pkgconf" = { os = ["linux"] }
"pacman:wayland" = { os = ["linux"] }
"pacman:wayland-protocols" = { os = ["linux"] }
"pacman:libglvnd" = { os = ["linux"] }
"pacman:egl-wayland" = { os = ["linux"] }
"pacman:curl" = { os = ["linux"] }
"pacman:unzip" = { os = ["linux"] }
"pacman:socat" = { os = ["linux"] }

"dnf:gcc-c++" = { os = ["linux"] }
"dnf:pkgconf-pkg-config" = { os = ["linux"] }
"dnf:wayland-devel" = { os = ["linux"] }
"dnf:wayland-protocols-devel" = { os = ["linux"] }
"dnf:mesa-libEGL-devel" = { os = ["linux"] }
"dnf:mesa-libGL-devel" = { os = ["linux"] }
"dnf:curl" = { os = ["linux"] }
"dnf:unzip" = { os = ["linux"] }
"dnf:socat" = { os = ["linux"] }

"brew:cmake" = { os = ["macos"] }
"brew:curl" = { os = ["macos"] }
"brew:socat" = { os = ["macos"] }

[tasks.bootstrap]
description = "Sanity-check the toolchain after `mise bootstrap`"
run = "cmake --version"

[tasks.build]
description = "Configure and build waifuland (checks deps, downloads GLEW/Cubism SDK if needed)"
run = "./install.sh"

[tasks.configure]
description = "Configure the CMake build directory only"
run = "cmake -S . -B build"

[tasks.compile]
description = "Build without re-running the full install.sh dependency/SDK check"
run = "cmake --build build -j"

[tasks.run]
description = "Run the built waifuland binary"
run = "./build/bin/waifuland"

[tasks.clean]
description = "Remove the build directory"
run = "rm -rf build"
